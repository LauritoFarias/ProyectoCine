<div class="auth-page">
  <div class="auth-card">
    <div class="card-header">
      <h2>Iniciar Sesión</h2>
      <p>Accede a tus entradas, puntos y combos</p>
    </div>

    <div class="alert error" *ngIf="mensajeError()">{{ mensajeError() }}</div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" name="email" [(ngModel)]="formData.email" required>
      </div>
      
      <div class="form-group">
        <label>Contraseña</label>
        <div class="password-wrapper">
          <input [type]="hidePassword() ? 'password' : 'text'" name="password" [(ngModel)]="formData.password" placeholder="Contraseña" required>
          
          <button type="button" class="btn-eye" (click)="togglePassword()">
            <svg *ngIf="hidePassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            
            <svg *ngIf="!hidePassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary">INGRESAR</button>
    </form>

    <div class="card-footer">
      <p>¿No tienes cuenta? <a routerLink="/registro">Crear cuenta</a></p>
    </div>
  </div>
</div>
